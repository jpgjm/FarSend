# Builds the Android APK. On failure, uploads the Gradle logs as an artifact.
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"  # Gradle 9.9 / AGP 9.5 (17 is the minimum; 21 matches the other workflows)

      # The wrapper downloads the Gradle distribution (~135 MB) on first use; services.gradle.org
      # can be slow and a timeout kills the whole job. Fetch it first (--version is cheap and
      # caches the distribution) and retry only this download, never the build itself.
      - name: Fetch Gradle distribution (with retries)
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            /bin/sh ./gradlew --version --no-daemon && exit 0
            echo "Gradle distribution download failed (attempt $i); retrying in 20s..." >&2
            sleep 20
          done
          exit 1

      - name: Build APK (release, debug-signed)
        shell: bash
        run: |
          set -euo pipefail
          /bin/sh ./gradlew :androidApp:assembleRelease --no-daemon 2>&1 | tee gradle-apk.log

      - name: Name APK
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          # Name and version come from gradle.properties
          APP=$(grep -E '^farsend.appName=' gradle.properties | head -n1 | cut -d= -f2- | tr -d '\r')
          VERSION=$(grep -E '^farsend.version=' gradle.properties | head -n1 | cut -d= -f2- | tr -d '\r')
          STAMP=$(TZ=Asia/Tokyo date +%Y%m%d-%H%M%S)
          NAME="${APP}-v${VERSION}-${STAMP}"
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "${NAME}.apk"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}-apk
          path: ${{ steps.meta.outputs.name }}.apk

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-apk-log
          path: gradle-apk.log
          if-no-files-found: ignore
